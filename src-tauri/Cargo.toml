[package]
name = "starter-kit-racing"
version = "0.1.0"
description = "A 3D racing game with block-based programming"
authors = ["you"]
edition = "2021"

[lib]
name = "starter_kit_racing_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
