# Build Starter Kit Racing with Tauri 2 for Android, Linux, and Windows
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ────────────────────────────────────────────────────
  # Linux (x86_64)
  # ────────────────────────────────────────────────────
  build-linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget \
            file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@latest

      - name: Copy web assets
        run: node scripts/copy-web.mjs

      - name: Build
        run: tauri build --target x86_64-unknown-linux-gnu

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Starter-Kit-Racing-Linux
          path: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/
          if-no-files-found: warn

  # ────────────────────────────────────────────────────
  # Windows (x86_64)
  # ────────────────────────────────────────────────────
  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Copy web assets
        run: node scripts/copy-web.mjs

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@latest

      - name: Build
        run: tauri build --target x86_64-pc-windows-msvc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Starter-Kit-Racing-Windows
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/
          if-no-files-found: warn

  # ────────────────────────────────────────────────────
  # Android (APK + AAB)
  # ────────────────────────────────────────────────────
  build-android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget \
            file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >
            aarch64-linux-android
            armv7-linux-androideabi
            x86_64-linux-android
            i686-linux-android

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Copy web assets
        run: node scripts/copy-web.mjs

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@latest

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973" 2>/dev/null || true
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Initialize Android project
        run: |
          rm -rf src-tauri/gen/android 2>/dev/null || true
          tauri android init 2>&1

      - name: Patch BuildTask.kt (use npx instead of node)
        run: |
          sed -i 's/val executable = """node"""/val executable = """npx"""/' \
            src-tauri/gen/android/buildSrc/src/main/java/com/starter_kit_racing/game/kotlin/BuildTask.kt
          echo "Patched BuildTask.kt:"
          grep 'executable' src-tauri/gen/android/buildSrc/src/main/java/com/starter_kit_racing/game/kotlin/BuildTask.kt

      - name: Build Android (APK)
        run: tauri android build --apk
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          NDK_HOME: /usr/local/lib/android/sdk/ndk/27.0.12077973

      - name: Create debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" -noprompt

      - name: Sign APK with debug key
        run: |
          find src-tauri/gen/android/app/build/outputs/apk/ -name "*unsigned*" | while read apk; do
            signed="${apk/-unsigned/-signed}"
            echo "Signing: $apk → $signed"
            ls $ANDROID_HOME/build-tools/ | sort -V | tail -1 | while read bt; do
              $ANDROID_HOME/build-tools/$bt/apksigner sign \
                --ks ~/.android/debug.keystore \
                --ks-pass pass:android \
                --ks-key-alias androiddebugkey \
                --key-pass pass:android \
                --out "$signed" "$apk"
            done
          done
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Build Android (AAB)
        run: tauri android build
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          NDK_HOME: /usr/local/lib/android/sdk/ndk/27.0.12077973

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Starter-Kit-Racing-Android
          path: |
            src-tauri/gen/android/app/build/outputs/apk/
          if-no-files-found: warn

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Starter-Kit-Racing-Android-AAB
          path: src-tauri/gen/android/app/build/outputs/bundle/
          if-no-files-found: warn